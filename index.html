
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New KOSA</title>

    <style>
        html, body{
            margin: 0;
            padding: 0;
            background-color: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
            color: #08090d;
        }

        main{
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            align-items: center;
            justify-content: center;
            background: transparent;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        h1{
            color: #08090d;
            font-size: 42px;
            font-weight: 500;
            letter-spacing: -1px;
            margin: 0 0 18px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        hr{
            margin: 0;
            width: 280px;
            border: none;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                #08090d,
                transparent
            );
        }

        #relogio{
            color: #08090d;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-top: 22px;
        }

        .gradientes{
            background: radial-gradient(
                circle,
                rgba(120, 120, 140, 0.18) 0%,
                rgba(120, 120, 140, 0) 70%
            );

            width: 60%;
            height: 60%;
            border-radius: 100vh;
            position: absolute;
            margin: 0;
            filter: blur(20px);
        }
        #menu{
            background-color: transparent;
            border-color: #08090d00;
            border-width: 2px;
            border-radius: 10px;
            border-style: solid;
            position: absolute;
            padding: 20px;
            height: 70vh;
            width: 40vh;
            left: 5%;
            top: 15%;
        }
        #pesquisa{
            overflow-y: scroll;
            width: 100%;
            height: 40%;
        }
        /* Barra de rolagem */
        ::-webkit-scrollbar {
            width: 4px;
        }

        /* Fundo da barra */
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Parte que se move */
        ::-webkit-scrollbar-thumb {
            background: rgb(0, 0, 0);
            border-radius: 10px;
        }
        .previsao {
            width: 320px;
            padding: 22px;
            width: 87%;
            height: 40%;
            background: #1d1d1d00;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);

            color: rgb(39, 39, 39);
            font-family: 'Segoe UI', sans-serif;
        }

        .local {
            color: #262626;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .temperatura {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .graus {
            font-size: 52px;
            font-weight: 300;
        }

        .clima {
            color: #262626;
            font-size: 15px;
            margin-top: -5px;
        }

        .detalhes {
            display: flex;
            gap: 15px;
            margin-top: 22px;
            padding-top: 15px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

            color: #262626;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main>
        <div id="menu">
            <div id="pesquisa"></div>
            <hr style="width: 100%; border-style: unset; margin-bottom: 40px;">
            <div class="previsao">
                <div class="local">
                    <span>📍 Natal, RN</span>
                </div>

                <div class="temperatura">
                    <span class="graus">28°</span>
                    <span class="clima">Parcialmente nublado</span>
                </div>

                <div class="detalhes">
                    <span>🌡️ Máx. 30°</span>
                    <span>💧 Umidade 75%</span>
                    <span>💨 Vento 12 km/h</span>
                </div>
            </div>
        </div>
        <h1 id="mensagem">
            Bom dia, Kaleb
        </h1>

        <hr>

        <h2 id="relogio">
            00:00:00
        </h2>
    </main>

    <div class="gradientes" style="left: 70%; top: 60%;"></div>
    <div class="gradientes" style="right: 70%; bottom: 60%;"></div>

    <script>
        function timer(){
            let time = new Date();

            let n1 = new Date().getHours();

            let horario = time.toLocaleTimeString("pt-BR", {
                timeZone: 'America/Sao_Paulo'
            });

            var relogio = document.getElementById("relogio");
            var mensagem = document.getElementById("mensagem")

            relogio.textContent = horario;

            if (n1 >= 6 && n1 < 12) {
                mensagem.innerText = "Bom dia, Kaleb"
            }
            else if (n1 >= 12 && n1 < 18) {
                mensagem.innerText = "Boa tarde, Kaleb"
            }
            else {
                mensagem.innerText = "Boa Noite, Kaleb"
            }

        }

        timer();

        setInterval(timer, 1000);

        let texto = "Quais a principais notícias do mundo?(Em portugues)"
        pesquisar(texto);

        async function pesquisar(texto) {

            let resposta = await fetch("https://api.tavily.com/search", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer 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"
                },

                body: JSON.stringify({
                    query: texto,
                    search_depth: "basic",
                    include_answer: true
                })
            });

            let dados = await resposta.json();

            console.log(dados.answer);

            const janela = document.getElementById("pesquisa");
            let informacao = `
            <div>
                <p>${dados.answer}</p>
            </div>
            `;

            janela.innerHTML += informacao;
        }
    </script>

</body>
</html>
