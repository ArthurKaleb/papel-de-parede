
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New KOSA</title>

    <style>
        html, body{
            margin: 0;
            padding: 0;
            background-color: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
            color: #08090d;
        }

        main{
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            align-items: center;
            justify-content: center;
            background: transparent;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        h1{
            color: #08090d;
            font-size: 42px;
            font-weight: 500;
            letter-spacing: -1px;
            margin: 0 0 18px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        hr{
            margin: 0;
            width: 280px;
            border: none;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                #08090d,
                transparent
            );
        }

        #relogio{
            color: #08090d;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-top: 22px;
        }

        .gradientes{
            background: radial-gradient(
                circle,
                rgba(120, 120, 140, 0.18) 0%,
                rgba(120, 120, 140, 0) 70%
            );

            width: 60%;
            height: 60%;
            border-radius: 100vh;
            position: absolute;
            margin: 0;
            filter: blur(20px);
        }
    </style>
</head>

<body>

    <main>
        <h1 id="mensagem">
            Bom dia, Kaleb
        </h1>

        <hr>

        <h2 id="relogio">
            00:00:00
        </h2>
    </main>

    <div class="gradientes" style="left: 70%; top: 60%;"></div>
    <div class="gradientes" style="right: 70%; bottom: 60%;"></div>

    <script>
        function timer(){
            let time = new Date();

            let n1 = new Date().getHours();

            let horario = time.toLocaleTimeString("pt-BR", {
                timeZone: 'America/Sao_Paulo'
            });

            var relogio = document.getElementById("relogio");
            var mensagem = document.getElementById("mensagem")

            relogio.textContent = horario;

            if (n1 >= 6 && n1 < 12) {
                mensagem.innerText = "Bom dia, Kaleb"
            }
            else if (n1 >= 12 && n1 < 18) {
                mensagem.innerText = "Boa tarde, Kaleb"
            }
            else {
                mensagem.innerText = "Boa Noite, Kaleb"
            }

        }

        timer();

        setInterval(timer, 1000);
    </script>

</body>
</html>
