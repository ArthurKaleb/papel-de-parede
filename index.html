<!DOCTYPE html>
<html lang=pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>New KOSA</title>
    <style>
        html, body{
            margin: 0;
            padding: 0;
            background-color: rgb(255, 255, 255);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }
        main{
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            align-items: center;
            justify-content: center;
            background-color: rgb(255, 255, 255);
            width: 100vw;
            height: 100vh;
        }
        h1{
            color: rgb(40, 40, 40);
        }
        hr{
            margin: 0;
            width: 50%;
            border: none;
            height: 2.5px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0), rgb(51, 51, 51), rgba(255, 255, 255, 0));
        }
        .gradientes{
            background: radial-gradient(circle, #9b99a823 0%, #ffffff00 70%);
            width:60%;
            height: 60%;
            border-radius: 100vh;
            position: absolute;
            margin: 0;
        }
    </style>
</head>
<body>
    <main>
        <h1>
        Bom dia Kaleb
        </h1>
        <hr>
        <h2 id="relogio">
            00:00:00
        </h2>
    </main>

    <div class="gradientes" style="left: 70%; top: 60%;"></div>
    <div class="gradientes" style="right: 70%; bottom: 60%;"></div>
    
    <script>
        function timer(){
        let time = new Date();

        let horario = time.toLocaleTimeString("pt-BR", {
            timeZone: 'America/Sao_Paulo'
        });

        var relogio = document.getElementById("relogio");

        relogio.textContent = horario;
    }

    timer();

    setInterval(timer, 1000);
    </script>
</body>
</html>
